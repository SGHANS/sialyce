<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIALYCE - Next-Gen Web Karaoke & Music Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff007f;
      --primary-glow: rgba(255, 0, 127, 0.6);
      --secondary: #00f0ff;
      --bg-dark: #090a0f;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --font-scale: 1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-dark);
      color: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 1. 앰비언트 배경 (유튜브 썸네일 블러) */
    #ambient-bg {
      position: absolute;
      top: -10%; left: -10%; width: 120%; height: 120%;
      background-image: url('https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(0.35);
      z-index: -2;
      transition: background-image 1s ease-in-out;
    }
    .bg-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 0%, #090a0f 90%);
      z-index: -1;
    }

    /* 2. 상단 네비게이션 & 검색바 */
    header {
      height: 70px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 100;
    }
    .logo {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--primary-glow);
      cursor: pointer;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      gap: 10px;
      align-items: center;
      width: 58%;
      max-width: 850px;
    }
    .input-group {
      display: flex;
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 5px 15px;
      align-items: center;
      transition: border 0.3s;
    }
    .input-group:focus-within { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
    .input-group input {
      background: transparent; border: none; color: #fff; padding: 8px; width: 100%; outline: none; font-size: 14px;
    }
    .btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .btn:hover { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); transform: translateY(-2px); }
    .btn-primary { background: var(--primary); border-color: var(--primary); }

    /* 실시간 가사 검색 드롭다운 */
    #search-results {
      position: absolute;
      top: 50px; left: 0; width: 100%;
      background: rgba(15, 17, 26, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      max-height: 380px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    }
    .result-item {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .result-item:hover { background: rgba(255, 0, 127, 0.18); }
    .badge { font-size: 11px; padding: 4px 10px; border-radius: 10px; background: var(--primary); font-weight: bold; }

    /* 3. 메인 워크스페이스 (좌: 영상/컨트롤, 우: 초대형 가사) */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      padding: 20px 30px;
      gap: 30px;
      height: calc(100vh - 140px);
    }

    /* 좌측 패널 */
    .left-panel {
      width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
      transition: width 0.4s ease;
    }
    .video-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
      position: relative;
    }
    #player { width: 100%; height: 100%; }

    /* 스튜디오 컨트롤 박스 */
    .control-card {
      background: var(--glass);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title { font-size: 12px; color: #aaa; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; }
    .control-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* 프리셋 & 예약 목록 탭 */
    .queue-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 5px;
    }
    .song-chip {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.2s;
    }
    .song-chip:hover { background: rgba(255,255,255,0.1); border-color: var(--secondary); transform: translateX(5px); }
    .song-chip .info { display: flex; flex-direction: column; gap: 2px; }
    .song-chip .title { font-weight: 700; font-size: 14px; }
    .song-chip .artist { font-size: 12px; color: #999; }

    /* 우측 패널: 초대형 가사 스테이지 */
    .right-panel {
      flex: 1;
      background: var(--glass);
      backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
    }

    .stage-header {
      padding: 20px 30px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .now-playing-info h1 { font-size: 22px; font-weight: 800; color: #fff; }
    .now-playing-info p { font-size: 14px; color: var(--secondary); font-weight: 600; }

    /* 🔥 초대형 가사 스크롤 컨테이너 */
    #lyrics-stage {
      flex: 1;
      overflow-y: auto;
      padding: 40vh 50px;
      scroll-behavior: smooth;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    #lyrics-stage::-webkit-scrollbar { width: 6px; }
    #lyrics-stage::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    .lyric-line {
      font-size: calc(22px * var(--font-scale));
      font-weight: 700;
      color: rgba(255, 255, 255, 0.25);
      filter: blur(1.5px);
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      line-height: 1.4;
      transform-origin: center center;
    }
    .lyric-line:hover { color: rgba(255, 255, 255, 0.6); filter: blur(0px); }
    .lyric-line.near {
      color: rgba(255, 255, 255, 0.5);
      filter: blur(0.5px);
      font-size: calc(25px * var(--font-scale));
    }

    /* 🔥 현재 부르는 가사: 초대형 네온 효과 */
    .lyric-line.active {
      font-size: calc(44px * var(--font-scale));
      font-weight: 900;
      color: #ffffff;
      filter: blur(0px);
      transform: scale(1.06);
      text-shadow: 
        0 0 15px var(--primary),
        0 0 30px var(--primary-glow),
        0 0 60px var(--primary);
      margin: 15px 0;
      letter-spacing: -0.5px;
    }

    /* 4. 하단 플레이어 독 & 비주얼라이저 */
    footer {
      height: 70px;
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      position: relative;
      z-index: 100;
    }
    .progress-container {
      position: absolute;
      top: -4px; left: 0; width: 100%; height: 4px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
    }
    #progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: 0 0 10px var(--primary);
      transition: width 0.1s linear;
    }

    .visualizer { display: flex; align-items: flex-end; gap: 3px; height: 25px; }
    .bar { width: 4px; height: 5px; background: var(--primary); border-radius: 2px; transition: height 0.1s ease; }
    .playing .bar { animation: bounce 0.6s infinite ease-in-out alternate; }
    .playing .bar:nth-child(2) { animation-delay: 0.1s; background: var(--secondary); }
    .playing .bar:nth-child(3) { animation-delay: 0.3s; }
    .playing .bar:nth-child(4) { animation-delay: 0.2s; background: var(--secondary); }
    .playing .bar:nth-child(5) { animation-delay: 0.4s; }
    @keyframes bounce { 0% { height: 4px; } 100% { height: 25px; } }

    /* 파티클 캔버스 & 점수 모달 */
    #confetti-canvas { position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index: 999; }
    #score-modal {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: linear-gradient(135deg, #1a1c29, #0f1016);
      border: 2px solid var(--primary);
      border-radius: 24px; padding: 40px 60px; text-align: center;
      box-shadow: 0 0 50px var(--primary-glow);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .score-num { font-size: 90px; font-weight: 900; font-family: 'Montserrat'; color: var(--secondary); text-shadow: 0 0 30px var(--secondary); margin: 10px 0; }

    /* 극장 모드 (좌측 패널 숨김) */
    body.cinema-mode .left-panel { width: 0; opacity: 0; padding: 0; overflow: hidden; margin-right: -30px; }
  </style>
</head>
<body>

  <!-- 배경 앰비언트 & 파티클 캔버스 -->
  <div id="ambient-bg"></div>
  <div class="bg-overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <!-- 상단 헤더 -->
  <header>
    <div class="logo" onclick="location.reload()">SIALYCE</div>

    <!-- 통합 검색바 -->
    <div class="search-wrapper">
      <div class="input-group">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="가수나 곡 제목 검색 후 엔터! (클릭 시 유튜브+가사 동시 자동 재생)" autocomplete="off" onkeyup="if(event.key==='Enter') searchLyricsDB()">
        <button class="btn btn-primary" onclick="searchLyricsDB()">곡 검색</button>
      </div>
      
      <div class="input-group" style="max-width: 240px;">
        <span>📺</span>
        <input type="text" id="yt-input" placeholder="유튜브 URL/ID 수동 입력" value="dQw4w9WgXcQ" onchange="applyYoutubeInput()">
      </div>
      <button class="btn" onclick="openYoutubeSearch()" title="유튜브에서 직접 영상 찾기">유튜브 ↗</button>

      <!-- 실시간 검색 결과 드롭다운 -->
      <div id="search-results"></div>
    </div>

    <!-- 우측 상단 유틸리티 버튼 -->
    <div style="display: flex; gap: 8px;">
      <button class="btn" onclick="toggleCinemaMode()" title="가사만 꽉 차게 보기">🎬 극장 모드</button>
      <button class="btn" onclick="changeTheme()" title="네온 테마 색상 변경">🎨 테마</button>
      <button class="btn" onclick="toggleFullScreen()" title="브라우저 전체화면">⛶ 전체화면</button>
    </div>
  </header>

  <!-- 메인 스테이지 -->
  <main>
    <!-- 좌측: 유튜브 비디오 + 스튜디오 컨트롤 + 프리셋 큐 -->
    <div class="left-panel">
      <div class="video-box">
        <div id="player"></div>
      </div>

      <!-- 노래방 리모컨 & 싱크 조절기 -->
      <div class="control-card">
        <div class="card-title">
          <span>🎛️ 싱크 & 스튜디오 컨트롤</span>
          <span id="offset-display" style="color:var(--secondary)">싱크 보정: 0.0초</span>
        </div>
        <div class="control-row">
          <button class="btn" onclick="adjustOffset(-0.5)">⏪ 가사 0.5초 빠르게</button>
          <button class="btn" onclick="adjustOffset(0.5)">가사 0.5초 느리게 ⏩</button>
          <button class="btn" onclick="adjustOffset(0, true)">초기화</button>
        </div>
        <div class="control-row">
          <button class="btn" onclick="jumpToFirstLyric()">⏭️ 간주 점프</button>
          <button class="btn" onclick="changeFontSize(0.15)">가사 크게 +</button>
          <button class="btn" onclick="changeFontSize(-0.15)">가사 작게 -</button>
          <button class="btn" onclick="downloadLRC()">💾 LRC 다운</button>
        </div>
      </div>

      <!-- 인기 프리셋 & 예약 큐 -->
      <div class="control-card" style="flex:1; overflow:hidden;">
        <div class="card-title">
          <span>🔥 원클릭 인기 노래방 프리셋</span>
          <span style="cursor:pointer; color:var(--primary);" onclick="addCurrentToQueue()">+ 현재 곡 저장</span>
        </div>
        <div class="queue-box" id="preset-list"></div>
      </div>
    </div>

    <!-- 우측: 초대형 가사 뷰어 -->
    <div class="right-panel" ondragover="event.preventDefault()" ondrop="handleDropLRC(event)">
      <div class="stage-header">
        <div class="now-playing-info">
          <h1 id="current-title">Never Gonna Give You Up</h1>
          <p id="current-artist">Rick Astley</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn" onclick="fireConfetti('🎉')">🎉 환호</button>
          <button class="btn" onclick="fireConfetti('👏')">👏 박수</button>
          <button class="btn" onclick="fireConfetti('💖')">💖 하트</button>
          <button class="btn btn-primary" onclick="showScoreModal()">🏆 점수 보기</button>
        </div>
      </div>

      <!-- 가사가 렌더링되는 메인 스테이지 -->
      <div id="lyrics-stage">
        <div class="lyric-line active">SIALYCE 스튜디오에 오신 것을 환영합니다!</div>
        <div class="lyric-line near">영상을 재생하면 노래방 가사가 시작됩니다.</div>
      </div>
    </div>
  </main>

  <!-- 하단 플레이어 바 -->
  <footer>
    <div class="progress-container" onclick="seekVideo(event)">
      <div id="progress-bar"></div>
    </div>

    <div style="display:flex; align-items:center; gap:15px;">
      <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <span id="time-display" style="font-family:'Montserrat'; font-size:14px; font-weight:700;">00:00 / 00:00</span>
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <button class="btn" onclick="skipTime(-10)">-10초</button>
      <button class="btn btn-primary" id="play-btn" onclick="togglePlay()" style="padding: 10px 25px; font-size:15px;">▶ 재생</button>
      <button class="btn" onclick="skipTime(10)">+10초</button>
      <select class="btn" style="background:#1a1c29;" onchange="changeSpeed(this.value)">
        <option value="0.75">0.75x (연습)</option>
        <option value="1" selected>1.0x (정속)</option>
        <option value="1.25">1.25x (빠름)</option>
        <option value="1.5">1.5x (매드)</option>
      </select>
    </div>

    <div style="display:flex; align-items:center; gap:10px;">
      <span>🔊</span>
      <input type="range" min="0" max="100" value="100" oninput="changeVolume(this.value)" style="accent-color: var(--primary); cursor:pointer;">
    </div>
  </footer>

  <!-- 노래방 점수 모달 -->
  <div id="score-modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <h2 style="color:#fff; font-size:24px;">🎤 SIALYCE 노래방 결과</h2>
      <div class="score-num" id="score-text">100점</div>
      <p id="score-comment" style="color:#ccc; font-size:18px; margin-bottom:25px;">가수 본인이신가요?! 완벽한 무대였습니다! 🔥</p>
      <button class="btn btn-primary" style="margin:0 auto; padding:12px 30px; font-size:16px;" onclick="document.getElementById('score-modal').style.display='none'">확인</button>
    </div>
  </div>

  <!-- 유튜브 IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // ==========================================
    // 1. 전역 상태 변수 및 인기곡 프리셋 (첫 곡: Never Gonna Give You Up)
    // ==========================================
    let player;
    let lyricsData = [];
    let rawLRC = "";
    let syncTimer;
    let lyricOffset = 0.0;
    let fontScale = 1.0;
    let currentActiveIndex = -1;
    let isPlainLyricsMode = false;

    const defaultPresets = [
      { ytId: "dQw4w9WgXcQ", artist: "Rick Astley", title: "Never Gonna Give You Up", offset: 0 },
      { ytId: "ArmDp-zijuc", artist: "NewJeans", title: "Super Shy", offset: 0 },
      { ytId: "jeqdYqsrsA0", artist: "아이유", title: "좋은 날", offset: 0 },
      { ytId: "0-q1KafFCLU", artist: "아이유", title: "Celebrity", offset: 0 },
      { ytId: "gdZLi9oWNZg", artist: "BTS", title: "Dynamite", offset: 0 },
      { ytId: "I0czvJ_jikg", artist: "DAY6", title: "한 페이지가 될 수 있게", offset: 0 }
    ];

    window.onload = () => {
      renderPresets();
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
          document.getElementById('search-results').style.display = 'none';
        }
      });
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.code === 'ArrowRight') skipTime(5);
        if (e.code === 'ArrowLeft') skipTime(-5);
      });
    };

    // ==========================================
    // 2. 유튜브 플레이어 초기화 (에러 자동 우회 포함)
    // ==========================================
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'dQw4w9WgXcQ', // 첫 시작: Never Gonna Give You Up
        playerVars: { 'playsinline': 1, 'rel': 0, 'origin': window.location.origin },
        events: {
          'onReady': () => fetchLyricsByQuery("Rick Astley", "Never Gonna Give You Up"),
          'onStateChange': onPlayerStateChange,
          'onError': async (e) => {
            if (e.data === 150 || e.data === 101 || e.data === 153) {
              console.warn("외부 재생 제한 영상 감지! 대체 음원 영상을 자동 검색합니다...");
              const artist = document.getElementById('current-artist').innerText;
              const title = document.getElementById('current-title').innerText;
              await autoPlayYoutubeVideo(`${artist} ${title} 가사 lyrics audio`, true);
            }
          }
        }
      });
    }

    function onPlayerStateChange(event) {
      const viz = document.getElementById('visualizer');
      const playBtn = document.getElementById('play-btn');

      if (event.data === YT.PlayerState.PLAYING) {
        viz.classList.add('playing');
        playBtn.innerText = "⏸ 일시정지";
        syncTimer = setInterval(updateStudioLoop, 80);
      } else {
        viz.classList.remove('playing');
        playBtn.innerText = "▶ 재생";
        clearInterval(syncTimer);
        if (event.data === YT.PlayerState.ENDED) showScoreModal();
      }
    }

    // ==========================================
    // 3. 🔥 원클릭 유튜브 영상 자동 검색 & 매칭 엔진
    // ==========================================
    async function autoPlayYoutubeVideo(query, skipFirst = false) {
      const searchQ = `${query} official audio 가사`;
      const instances = [
        'https://pipedapi.kavin.rocks',
        'https://pipedapi.tokhmi.xyz',
        'https://pipedapi.moomoo.me',
        'https://api.piped.projectsegfau.lt'
      ];

      for (const api of instances) {
        try {
          const res = await fetch(`${api}/search?q=${encodeURIComponent(searchQ)}&filter=videos`);
          if (!res.ok) continue;
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            const targetItem = (skipFirst && data.items.length > 1) ? data.items[1] : data.items[0];
            const videoId = targetItem.url.split('v=')[1];
            if (videoId) {
              document.getElementById('yt-input').value = videoId;
              applyYoutubeInput();
              return true;
            }
          }
        } catch (err) {
          continue;
        }
      }
      return false;
    }

    // ==========================================
    // 4. 통합 검색 (싱크 가사 + 일반 가사 + DB에 없는 곡 모두 지원!)
    // ==========================================
    async function searchLyricsDB() {
      const q = document.getElementById('search-input').value.trim();
      const resultsBox = document.getElementById('search-results');
      if (!q) return;

      resultsBox.style.display = 'flex';
      resultsBox.innerHTML = '<div class="result-item">🔍 곡과 유튜브 영상을 찾는 중입니다...</div>';

      try {
        const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        
        const validList = data
          .filter(item => item.syncedLyrics || item.plainLyrics)
          .sort((a, b) => (b.syncedLyrics ? 1 : 0) - (a.syncedLyrics ? 1 : 0));

        resultsBox.innerHTML = '';

        // 1) DB에 아예 없는 곡(예: 천진우 - 세모네모동그라미 등)을 위한 만능 버튼 항상 노출!
        const directDiv = document.createElement('div');
        directDiv.className = 'result-item';
        directDiv.style.background = 'rgba(0, 240, 255, 0.12)';
        directDiv.innerHTML = `
          <div>
            <div style="font-weight:800; color:var(--secondary);">🚀 "${q}" 유튜브 바로 재생 + 직접 가사 입력 모드</div>
            <div style="font-size:12px; color:#ccc;">가사 DB에 없는 곡도 클릭 한 번으로 유튜브 영상을 자동으로 틀고 가사를 띄울 수 있습니다!</div>
          </div>
          <span class="badge" style="background:var(--secondary); color:#000;">만능 재생</span>
        `;
        directDiv.onclick = async () => {
          resultsBox.style.display = 'none';
          document.getElementById('current-title').innerText = q;
          document.getElementById('current-artist').innerText = "YouTube Direct Stream";
          showCustomLyricsEditor(q);
          await autoPlayYoutubeVideo(q);
        };
        resultsBox.appendChild(directDiv);

        // 2) 검색된 가사 리스트 출력 (클릭 시 유튜브 영상 + 가사 동시 세팅)
        validList.slice(0, 12).forEach(item => {
          const hasSync = Boolean(item.syncedLyrics);
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `
            <div>
              <div style="font-weight:700; color:#fff;">${item.trackName}</div>
              <div style="font-size:12px; color:#aaa;">${item.artistName} · ${item.albumName || ''}</div>
            </div>
            <span class="badge" style="background:${hasSync ? 'var(--primary)' : '#555'}">
              ${hasSync ? '⚡ 정밀 싱크' : '📜 일반 가사 (자동 스크롤)'}
            </span>
          `;
          div.onclick = async () => {
            resultsBox.style.display = 'none';
            applyTrackInfo(item.artistName, item.trackName, item.syncedLyrics, item.plainLyrics, item.duration);
            await autoPlayYoutubeVideo(`${item.artistName} ${item.trackName}`);
          };
          resultsBox.appendChild(div);
        });

      } catch (err) {
        resultsBox.innerHTML = '<div class="result-item">검색 중 오류가 발생했습니다.</div>';
      }
    }

    async function fetchLyricsByQuery(artist, track) {
      document.getElementById('current-artist').innerText = artist;
      document.getElementById('current-title').innerText = track;
      const stage = document.getElementById('lyrics-stage');
      stage.innerHTML = '<div class="lyric-line active">가사를 불러오는 중입니다... ⏳</div>';

      try {
        const res = await fetch(`https://lrclib.net/api/search?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}`);
        const data = await res.json();
        const bestMatch = data.find(i => i.syncedLyrics) || data.find(i => i.plainLyrics);
        
        if (bestMatch) {
          applyTrackInfo(bestMatch.artistName, bestMatch.trackName, bestMatch.syncedLyrics, bestMatch.plainLyrics, bestMatch.duration);
        } else {
          showCustomLyricsEditor(`${artist} - ${track}`);
        }
      } catch (e) {
        console.error(e);
      }
    }

    // ==========================================
    // 5. 가사 파싱 (정밀 싱크 & 타이밍 없는 일반 가사 오토 싱크 겸용)
    // ==========================================
    function applyTrackInfo(artist, title, syncedLrc, plainLrc = "", trackDuration = 210) {
      document.getElementById('current-artist').innerText = artist;
      document.getElementById('current-title').innerText = title;
      
      if (syncedLrc) {
        isPlainLyricsMode = false;
        rawLRC = syncedLrc;
        parseSyncedLRC(syncedLrc);
      } else if (plainLrc) {
        isPlainLyricsMode = true;
        rawLRC = plainLrc;
        parsePlainLyricsToAutoSync(plainLrc, trackDuration);
      }
      renderLyricsStage();
    }

    function parseSyncedLRC(lrcText) {
      lyricsData = [];
      currentActiveIndex = -1;
      const lines = lrcText.split('\n');
      const regex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;

      lines.forEach(line => {
        const match = regex.exec(line);
        if (match) {
          const min = parseInt(match[1], 10);
          const sec = parseFloat(match[2]);
          const text = match[3].trim();
          if (text) lyricsData.push({ time: min * 60 + sec, text: text });
        }
      });
    }

    function parsePlainLyricsToAutoSync(plainText, estimatedDuration = 200) {
      lyricsData = [];
      currentActiveIndex = -1;
      const lines = plainText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const totalDuration = (player && player.getDuration() > 30) ? player.getDuration() : (estimatedDuration || 200);
      const step = (totalDuration * 0.85) / Math.max(1, lines.length);

      lines.forEach((line, idx) => {
        lyricsData.push({
          time: 5 + (idx * step),
          text: line
        });
      });
    }

    function showCustomLyricsEditor(songTitle) {
      const stage = document.getElementById('lyrics-stage');
      stage.innerHTML = `
        <div class="lyric-line active" style="font-size:28px;">🎵 "${songTitle}" 재생 준비 완료!</div>
        <div style="color:#aaa; font-size:15px; margin-bottom:10px;">
          이 곡은 오픈소스 가사 DB에 아직 등록되지 않은 곡입니다.<br>
          아래에 네이버/벅스 등에서 가사를 복사해 붙여넣으시면 <b>자동으로 노래방 자막으로 변환</b>됩니다!
        </div>
        <textarea id="custom-lyrics-textarea" placeholder="여기에 가사를 복사해서 붙여넣어 주세요..." 
          style="width:80%; height:180px; margin:0 auto; background:rgba(0,0,0,0.6); color:#fff; border:1px solid var(--primary); border-radius:12px; padding:15px; font-size:15px; outline:none;"></textarea>
        <div style="margin-top:10px;">
          <button class="btn btn-primary" style="margin:0 auto; padding:12px 30px; font-size:16px;" onclick="applyCustomPastedLyrics()">✨ 노래방 가사로 즉시 변환하기</button>
        </div>
      `;
    }

    function applyCustomPastedLyrics() {
      const text = document.getElementById('custom-lyrics-textarea').value.trim();
      if (!text) return alert("가사를 붙여넣어 주세요!");
      if (/\[\d{2}:\d{2}/.test(text)) {
        isPlainLyricsMode = false;
        parseSyncedLRC(text);
      } else {
        isPlainLyricsMode = true;
        parsePlainLyricsToAutoSync(text);
      }
      renderLyricsStage();
      fireConfetti('✨');
    }

    function renderLyricsStage() {
      const stage = document.getElementById('lyrics-stage');
      stage.innerHTML = '';
      if (isPlainLyricsMode) {
        const notice = document.createElement('div');
        notice.style.cssText = "font-size:13px; color:var(--secondary); margin-bottom:15px;";
        notice.innerText = "💡 이 곡은 타이밍 데이터가 없어 곡 길이에 맞춰 [스마트 오토 스크롤] 모드로 작동합니다. (가사 클릭 시 해당 위치로 조절 가능)";
        stage.appendChild(notice);
      }

      lyricsData.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'lyric-line';
        div.id = `lyric-${idx}`;
        div.innerText = item.text;
        div.onclick = () => {
          if (player) player.seekTo(Math.max(0, item.time - lyricOffset), true);
        };
        stage.appendChild(div);
      });
    }

    // ==========================================
    // 6. 초정밀 가사 싱크 & 대형 포커스 스크롤 루프
    // ==========================================
    function updateStudioLoop() {
      if (!player || typeof player.getCurrentTime !== 'function') return;

      const curTime = player.getCurrentTime();
      const duration = player.getDuration() || 1;

      document.getElementById('progress-bar').style.width = `${(curTime / duration) * 100}%`;
      document.getElementById('time-display').innerText = `${formatTime(curTime)} / ${formatTime(duration)}`;

      if (!lyricsData.length) return;
      const syncedTime = curTime + lyricOffset;
      let newIndex = -1;

      for (let i = 0; i < lyricsData.length; i++) {
        if (syncedTime >= lyricsData[i].time) {
          newIndex = i;
        } else {
          break;
        }
      }

      if (newIndex !== -1 && newIndex !== currentActiveIndex) {
        currentActiveIndex = newIndex;
        
        document.querySelectorAll('.lyric-line').forEach((el, idx) => {
          el.classList.remove('active', 'near');
          if (idx === currentActiveIndex) {
            el.classList.add('active');
          } else if (Math.abs(idx - currentActiveIndex) === 1) {
            el.classList.add('near');
          }
        });

        const activeEl = document.getElementById(`lyric-${currentActiveIndex}`);
        const stage = document.getElementById('lyrics-stage');
        if (activeEl && stage) {
          const targetScroll = activeEl.offsetTop - stage.offsetTop - (stage.clientHeight / 2) + (activeEl.clientHeight / 2);
          stage.scrollTop = targetScroll;
        }
      }
    }

    // ==========================================
    // 7. 프리셋 및 스튜디오 컨트롤 유틸리티
    // ==========================================
    function extractYoutubeId(input) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);
      return (match && match[2].length === 11) ? match[2] : input.trim();
    }

    function applyYoutubeInput() {
      const raw = document.getElementById('yt-input').value;
      const videoId = extractYoutubeId(raw);
      if (videoId && player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
        document.getElementById('ambient-bg').style.backgroundImage = `url('https://img.youtube.com/vi/${videoId}/maxresdefault.jpg')`;
      }
    }

    function openYoutubeSearch() {
      const artist = document.getElementById('current-artist').innerText;
      const title = document.getElementById('current-title').innerText;
      const query = encodeURIComponent(`${artist} ${title} 가사 audio`);
      window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
    }

    function renderPresets() {
      const saved = JSON.parse(localStorage.getItem('sialyce_presets_v2') || 'null') || defaultPresets;
      const box = document.getElementById('preset-list');
      box.innerHTML = '';

      saved.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'song-chip';
        div.innerHTML = `
          <div class="info">
            <span class="title">${item.title}</span>
            <span class="artist">${item.artist}</span>
          </div>
          <span style="color:var(--primary); font-size:18px;">▶</span>
        `;
        div.onclick = () => {
          document.getElementById('yt-input').value = item.ytId;
          lyricOffset = item.offset || 0;
          updateOffsetDisplay();
          applyYoutubeInput();
          fetchLyricsByQuery(item.artist, item.title);
        };
        box.appendChild(div);
      });
    }

    function addCurrentToQueue() {
      const ytId = extractYoutubeId(document.getElementById('yt-input').value);
      const artist = document.getElementById('current-artist').innerText;
      const title = document.getElementById('current-title').innerText;
      const saved = JSON.parse(localStorage.getItem('sialyce_presets_v2') || 'null') || defaultPresets;
      
      saved.unshift({ ytId, artist, title, offset: lyricOffset });
      localStorage.setItem('sialyce_presets_v2', JSON.stringify(saved.slice(0, 20)));
      renderPresets();
      fireConfetti('💾');
    }

    function adjustOffset(val, reset = false) {
      lyricOffset = reset ? 0.0 : parseFloat((lyricOffset + val).toFixed(1));
      updateOffsetDisplay();
    }
    function updateOffsetDisplay() {
      const sign = lyricOffset > 0 ? '+' : '';
      document.getElementById('offset-display').innerText = `싱크 보정: ${sign}${lyricOffset.toFixed(1)}초`;
    }

    function jumpToFirstLyric() {
      if (player && lyricsData.length > 0) {
        player.seekTo(Math.max(0, lyricsData[0].time - lyricOffset - 1.5), true);
      }
    }

    function changeFontSize(delta) {
      fontScale = Math.min(1.6, Math.max(0.6, fontScale + delta));
      document.documentElement.style.setProperty('--font-scale', fontScale);
    }

    function togglePlay() {
      if (!player) return;
      const state = player.getPlayerState();
      state === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
    }

    function skipTime(sec) { if (player) player.seekTo(player.getCurrentTime() + sec, true); }

    function seekVideo(e) {
      if (!player) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      player.seekTo(player.getDuration() * ratio, true);
    }

    function changeSpeed(rate) { if (player) player.setPlaybackRate(parseFloat(rate)); }
    function changeVolume(val) { if (player) player.setVolume(val); }
    function toggleCinemaMode() { document.body.classList.toggle('cinema-mode'); }
    function toggleFullScreen() {
      !document.fullscreenElement ? document.documentElement.requestFullscreen() : document.exitFullscreen();
    }

    const themes = [
      { p: '#ff007f', g: 'rgba(255,0,127,0.6)', s: '#00f0ff' },
      { p: '#00f0ff', g: 'rgba(0,240,255,0.6)', s: '#7000ff' },
      { p: '#00ff88', g: 'rgba(0,255,136,0.6)', s: '#ffee00' },
      { p: '#ffaa00', g: 'rgba(255,170,0,0.6)', s: '#ff0055' }
    ];
    let themeIdx = 0;
    function changeTheme() {
      themeIdx = (themeIdx + 1) % themes.length;
      const t = themes[themeIdx];
      document.documentElement.style.setProperty('--primary', t.p);
      document.documentElement.style.setProperty('--primary-glow', t.g);
      document.documentElement.style.setProperty('--secondary', t.s);
    }

    function handleDropLRC(e) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          applyTrackInfo("Custom Upload", file.name.replace('.lrc', ''), event.target.result);
          fireConfetti('📂');
        };
        reader.readAsText(file);
      }
    }

    function downloadLRC() {
      if (!rawLRC) return alert("다운로드할 가사가 없습니다.");
      const blob = new Blob([rawLRC], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${document.getElementById('current-title').innerText}.lrc`;
      a.click();
    }

    function showScoreModal() {
      const score = Math.floor(Math.random() * 16) + 85;
      document.getElementById('score-text').innerText = `${score}점`;
      document.getElementById('score-modal').style.display = 'flex';
      fireConfetti('🎉');
    }

    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function fireConfetti(emoji = '🎉') {
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: window.innerWidth / 2, y: window.innerHeight - 100,
          vx: (Math.random() - 0.5) * 25, vy: -(Math.random() * 18 + 10),
          size: Math.random() * 20 + 20, emoji: emoji, alpha: 1
        });
      }
      if (particles.length <= 35) requestAnimationFrame(renderParticles);
    }
    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.alpha -= 0.012;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.font = `${p.size}px serif`;
        ctx.fillText(p.emoji, p.x, p.y);
        if (p.alpha <= 0) particles.splice(idx, 1);
      });
      if (particles.length > 0) requestAnimationFrame(renderParticles);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }
  </script>
